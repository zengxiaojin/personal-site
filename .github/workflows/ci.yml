# 每次把代码推送到 GitHub 或发起 Pull Request 时，自动编译并运行全部测试。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 编译和测试
    runs-on: ubuntu-latest

    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 安装 Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 测试会用 Docker 启动一个真正的 PostgreSQL，GitHub 的环境里已经装好了 Docker
      - name: 编译并运行测试
        run: sh ./mvnw -B verify

  docker:
    name: 打包 Docker 镜像
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      # 只确认镜像能打包成功，不上传到任何地方
      - name: 打包镜像
        run: docker build -t personal-site .
