# 线上环境专用。密码等敏感信息全部来自环境变量，不写进代码。
#
# 需要设置的环境变量：
#   SPRING_PROFILES_ACTIVE=prod
#   DATABASE_URL        例：jdbc:postgresql://主机名:5432/数据库名?sslmode=require
#   DATABASE_USERNAME
#   DATABASE_PASSWORD
#   ADMIN_USERNAME      管理后台的用户名
#   ADMIN_PASSWORD      管理后台的密码
#   SITE_BASE_URL       例：https://example.dev

server:
  # 网站前面有 Cloudflare 等代理时，正确识别访问者使用的是 https
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

app:
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
