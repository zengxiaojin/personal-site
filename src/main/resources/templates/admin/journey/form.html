<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(${id == null} ? '添加一件事' : '编辑历程')}"></head>
<body>

<header th:replace="~{admin/layout :: header('journey')}"></header>

<main class="admin-page admin-page--narrow">

	<div class="admin-title">
		<h1 th:text="${id == null} ? '添加一件事' : '编辑历程'">添加一件事</h1>
	</div>

	<form th:action="${id == null} ? @{/admin/journey} : @{/admin/journey/{id}(id=${id})}"
	      th:object="${form}" method="post" class="form" novalidate>

		<p th:replace="~{admin/layout :: error-summary}"></p>

		<div class="field-row">
			<div class="field">
				<label for="year">年份</label>
				<input type="number" th:field="*{year}" th:errorclass="is-invalid" inputmode="numeric">
				<p class="field__error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">错误提示</p>
			</div>
			<div class="field">
				<label for="month">月份（可以不填）</label>
				<input type="number" th:field="*{month}" th:errorclass="is-invalid" inputmode="numeric" min="1" max="12">
				<p class="field__error" th:if="${#fields.hasErrors('month')}" th:errors="*{month}">错误提示</p>
			</div>
		</div>

		<div class="field">
			<label for="title">发生了什么</label>
			<input type="text" th:field="*{title}" th:errorclass="is-invalid" maxlength="200">
			<p class="field__error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">错误提示</p>
		</div>

		<div class="field">
			<label for="description">补充说明（可以不填）</label>
			<textarea th:field="*{description}" th:errorclass="is-invalid" rows="4"></textarea>
			<p class="field__error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">错误提示</p>
		</div>

		<div class="form__actions">
			<button type="submit" class="button button--primary">保存</button>
			<a th:href="@{/admin/journey}">取消</a>
		</div>

	</form>

</main>

</body>
</html>
