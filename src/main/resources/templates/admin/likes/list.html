<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('喜欢的东西')}"></head>
<body>

<header th:replace="~{admin/layout :: header('likes')}"></header>

<main class="admin-page">

	<div class="admin-title">
		<h1>喜欢的东西</h1>
		<a class="button button--primary" th:href="@{/admin/likes/new}">添加</a>
	</div>

	<p th:replace="~{admin/layout :: flash}"></p>

	<p class="empty" th:if="${#lists.isEmpty(items)}">还没有记录。可以添加喜欢的书、电影、音乐、地方等。</p>

	<div class="table-wrap" th:if="${!#lists.isEmpty(items)}">
		<table class="table">
			<thead>
				<tr>
					<th>类别</th>
					<th>名字</th>
					<th>排序</th>
					<th class="table__actions">操作</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${items}">
					<td class="table__nowrap" th:text="${item.category}">书</td>
					<td>
						<a th:href="@{/admin/likes/{id}/edit(id=${item.id})}" th:text="${item.title}">名字</a>
						<span class="table__sub" th:if="${!#strings.isEmpty(item.note)}" th:text="${item.note}">感想</span>
					</td>
					<td th:text="${item.sortOrder}">0</td>
					<td class="table__actions">
						<a th:href="@{/admin/likes/{id}/edit(id=${item.id})}">编辑</a>
						<form th:action="@{/admin/likes/{id}/delete(id=${item.id})}" method="post" class="inline-form"
						      onsubmit="return confirm('确定删除这一项吗？删除后无法恢复。')">
							<button type="submit" class="button button--text button--danger">删除</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>

</body>
</html>
