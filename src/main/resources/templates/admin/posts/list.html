<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('文章')}"></head>
<body>

<header th:replace="~{admin/layout :: header('posts')}"></header>

<main class="admin-page">

	<div class="admin-title">
		<h1>文章</h1>
		<a class="button button--primary" th:href="@{/admin/posts/new}">写文章</a>
	</div>

	<p th:replace="~{admin/layout :: flash}"></p>

	<p class="empty" th:if="${#lists.isEmpty(posts)}">还没有文章。</p>

	<div class="table-wrap" th:if="${!#lists.isEmpty(posts)}">
		<table class="table">
			<thead>
				<tr>
					<th>标题</th>
					<th>状态</th>
					<th>发布日期</th>
					<th class="table__actions">操作</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="post : ${posts}">
					<td>
						<a th:href="@{/admin/posts/{id}/edit(id=${post.id})}" th:text="${post.title}">文章标题</a>
						<span class="table__sub" th:text="${'/posts/' + post.slug}">/posts/hello</span>
					</td>
					<td>
						<span class="badge" th:classappend="${post.status.name() == 'PUBLISHED'} ? 'badge--on'"
						      th:text="${post.status.label}">草稿</span>
					</td>
					<td th:text="${@dates.date(post.publishedAt)}">2026.11.16</td>
					<td class="table__actions">
						<a th:if="${post.status.name() == 'PUBLISHED'}" th:href="@{/posts/{slug}(slug=${post.slug})}"
						   target="_blank" rel="noopener">查看</a>
						<a th:href="@{/admin/posts/{id}/edit(id=${post.id})}">编辑</a>
						<form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post" class="inline-form"
						      onsubmit="return confirm('确定删除这篇文章吗？删除后无法恢复。')">
							<button type="submit" class="button button--text button--danger">删除</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</main>

</body>
</html>
