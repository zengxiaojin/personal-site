<!DOCTYPE html>
<!--
  404 以外的错误页。数据库连不上时也可能显示这一页，
  所以这里不使用名字等来自数据库的内容。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="#{error.500.title}">出了点问题</title>
	<meta name="color-scheme" content="light dark">
	<meta name="robots" content="noindex">
	<link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<main class="page">

	<h1 class="page-title" th:text="#{error.500.title}">出了点问题</h1>
	<p class="empty" th:text="#{error.500.body}">网站暂时无法显示这个页面，请稍后再试。</p>
	<p class="more"><a class="link-arrow" th:href="@{/}" th:text="#{error.back}">回到首页</a></p>

</main>

</body>
</html>
